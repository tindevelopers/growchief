steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.dev'
      - '-t'
      - 'us-central1-docker.pkg.dev/postiz-master-social-v1/growchief/growchief:latest'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/postiz-master-social-v1/growchief/growchief:latest'
images:
  - 'us-central1-docker.pkg.dev/postiz-master-social-v1/growchief/growchief:latest'
options:
  machineType: 'E2_HIGHCPU_8'
timeout: '3600s'
